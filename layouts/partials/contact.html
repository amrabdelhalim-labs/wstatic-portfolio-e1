<div class="card card--half">
    <h2>تواصل معي</h2>
    <p class="contact-desc">يمكنك التواصل معي عبر الوسائل الآتية </p>
    {{ range .Site.Data.contact }}
        <div class="line">
            <div class="line_head">
                <i class="{{ .icon }}"></i>
                <h3>{{ .title }}</h3>
            </div>
            <div class="line_body">
                <p dir="ltr">{{ .content }}</p>
            </div>
        </div>
    {{ end }}
</div>
